services:
  momo-fraud-detection:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MOMO_MAX_ROWS=1000000
      - MOMO_MAX_UPLOAD_MB=300
      - MOMO_ALLOW_PRIVATE_HOSTS=0      # the REST/database connectors cannot reach internal addresses
      - MOMO_ALLOW_SERVER_FILES=0       # visitors cannot read SQLite files on the server
      - MOMO_ALLOW_REGISTRATION=1       # set to 0 to stop new sign-ups
      - MOMO_API_DOCS=1                 # set to 0 to hide the interactive API docs at /docs
      - MOMO_REQUIRE_2FA=0              # set to 1 so every account must use two-step sign-in
      # - MOMO_ADMIN_EMAILS=you@example.org   # who gets the Administration page
      # - MOMO_SECRET_KEY=long-random-string  # encrypts two-step secrets; keep it out of database backups
      # - MOMO_SECURE_COOKIES=1         # turn on once the site is served over HTTPS (also enables HSTS)
      # Email for "Forgot password?" (without these, reset links are printed in the container log):
      # - MOMO_PUBLIC_URL=https://momo.example.org
      # - MOMO_SMTP_HOST=smtp.example.org
      # - MOMO_SMTP_PORT=587
      # - MOMO_SMTP_USER=no-reply@example.org
      # - MOMO_SMTP_PASSWORD=change-me
      # - MOMO_SMTP_FROM=MoMo Fraud Detection <no-reply@example.org>
    volumes:
      - momo-accounts:/app/var          # user accounts, kept across rebuilds (backup: see SECURITY.md)
      - ./backend/data:/app/backend/data:ro
      - ./reports:/app/reports:ro
    read_only: true                     # the app cannot change its own code or model
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  momo-accounts:
