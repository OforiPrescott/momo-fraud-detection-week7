name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install libomp (XGBoost needs it on macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit, security and API tests
        run: python -m pytest tests -q --ignore=tests/smoke_test.py
      - name: End-to-end smoke test
        run: python tests/smoke_test.py
        env:
          PYTHONIOENCODING: utf-8

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true  # report new advisories without blocking unrelated work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start with docker-compose.yml (hardened settings)
        run: docker compose up --build -d
      - name: Health check answers
        run: |
          for i in $(seq 1 45); do curl -fs http://localhost:8000/api/health && exit 0; sleep 2; done
          docker compose logs; exit 1
      - name: Dashboard is served with security headers
        run: |
          curl -fs http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsI http://localhost:8000/ | grep -qi "content-security-policy"
      - name: Accounts volume is writable (sign-up works)
        run: |
          curl -fs -X POST http://localhost:8000/api/auth/register -H 'Content-Type: application/json' \
            -d '{"name":"CI Check","email":"ci-check@example.org","password":"Build-check-2026"}' | grep -q '"email"'
      - name: Runs as an unprivileged user on a read-only file system
        run: |
          test "$(docker compose exec -T momo-fraud-detection id -u)" = "10001"
          ! docker compose exec -T momo-fraud-detection touch /app/backend/tamper 2>/dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  frontend:
    name: Dashboard builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
