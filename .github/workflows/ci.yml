name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install libomp (XGBoost needs it on macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit, security and API tests
        run: python -m pytest tests -q --ignore=tests/smoke_test.py
      - name: End-to-end smoke test
        run: python tests/smoke_test.py
        env:
          PYTHONIOENCODING: utf-8

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true  # report new advisories without blocking unrelated work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  frontend:
    name: Dashboard builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
